packages:
  - "apps/*"
  - "packages/*"

# One React for the whole workspace. React Native 0.88 (Expo SDK 58) needs
# exactly this version, and a second copy hoisted for the web apps would
# leave expo-router's own dependencies on a different React.
overrides:
  "react": "19.3.0"
  "react-dom": "19.3.0"

# Fixes to installed packages the phone app needs (were patch-package patches).
patchedDependencies:
  "react-native-web-refresh-control@1.1.2": apps/mobile/patches/react-native-web-refresh-control@1.1.2.patch
  "sonner-native@0.21.0": apps/mobile/patches/sonner-native@0.21.0.patch
