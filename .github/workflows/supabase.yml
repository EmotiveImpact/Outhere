name: Database

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  push:
    branches: [main]
    paths: ["supabase/**"]

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrate, seed and test
        run: ./supabase/tests/run.sh
      - name: Types are up to date
        run: |
          createdb oh_types
          sed "/^create role/d" supabase/tests/shim.sql | psql -d oh_types -q > /dev/null
          for f in supabase/migrations/*.sql; do psql -d oh_types -q -v ON_ERROR_STOP=1 -f "$f" > /dev/null; done
          python3 supabase/scripts/gen_types.py oh_types /tmp/database.ts
          diff -u supabase/types/database.ts /tmp/database.ts

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Run from the functions folder so Deno reads its own deno.json and
      # leaves the pnpm workspace at the root alone.
      - name: Typecheck Edge Functions
        working-directory: supabase/functions
        run: deno check story-media/index.ts
      - name: Test the R2 helper
        working-directory: supabase/functions
        run: deno test --allow-env _shared/r2_test.ts
