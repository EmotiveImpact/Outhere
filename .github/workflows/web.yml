name: Web and admin

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
