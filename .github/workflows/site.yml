name: Website

on:
  pull_request:
    paths: ['apps/site/**', '.github/workflows/site.yml', 'supabase/**']
  push:
    branches: [main]
    paths: ['apps/site/**', '.github/workflows/site.yml', 'supabase/**']

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check every page was written
        run: |
          test -f dist/index.html && test -f dist/crews/index.html && test -f dist/black/index.html
          test -f dist/privacy/index.html && test -f dist/404.html && test -f dist/sitemap.xml
          test "$(ls dist/boroughs | grep -v index.html | wc -l)" -eq 32
          grep -q 'Every step' dist/index.html

  database:
    name: Website database functions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply the app schema, then the website functions, and test them
        run: |
          if [ ! -d supabase/migrations ]; then
            echo "No app schema on this branch yet (it arrives with the mobile build), so there is nothing to test against."
            exit 0
          fi
          bash apps/site/db/test.sh
