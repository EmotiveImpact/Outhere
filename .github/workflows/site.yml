name: Website

on:
  pull_request:
    paths: ['apps/site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['apps/site/**', '.github/workflows/site.yml']

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check every page was written
        run: |
          test -f dist/index.html && test -f dist/crews/index.html && test -f dist/black/index.html
          test -f dist/privacy/index.html && test -f dist/404.html && test -f dist/sitemap.xml
          test "$(ls dist/boroughs | grep -v index.html | wc -l)" -eq 32
          grep -q 'Every step' dist/index.html

